name: Delete only the confirmed scenario group

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Isolated training environment
        type: choice
        options: [dev]
        default: dev
        required: true
      resource_group_confirmation:
        description: Type the exact resourceGroup name from config/dev.json
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: php2shell-dev
  cancel-in-progress: false

jobs:
  teardown:
    runs-on: ubuntu-24.04
    environment: dev
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      DOJO_ENV: ${{ inputs.environment }}
      DOJO_SUFFIX: ${{ vars.LAB_SUFFIX }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      CONFIRMED_RG: ${{ inputs.resource_group_confirmation }}
      AZURE_CORE_COLLECT_TELEMETRY: "false"
      AZURE_LOGIN_POST_CLEANUP: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Verify GitHub environment protections (read-only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-github.mjs --environment "$DOJO_ENV"
      - name: Use ephemeral Azure CLI configuration
        run: |
          set -euo pipefail
          printf 'AZURE_CONFIG_DIR=%s/php2shell-azure\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Validate dev input offline
        run: node scripts/dojo.mjs plan --environment "$DOJO_ENV"
      - uses: azure/login@935127ca5bb3c4b02c9c2c10060028383878f33f # v3
        with:
          client-id: ${{ vars.AZURE_TEARDOWN_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Exact confirmation, ownership checks and resource-group-only deletion
        run: bash scripts/dojo.sh uninstall --environment "$DOJO_ENV" --confirm-resource-group "$CONFIRMED_RG"
